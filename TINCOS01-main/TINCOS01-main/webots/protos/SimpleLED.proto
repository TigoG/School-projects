#VRML_SIM R2023b utf8

PROTO SimpleLED [ 
  field MFColor color [ 1 0 0 ]
  field SFVec3f translation 0 0 0
  field SFString name "led0"
] 
{
  LED { 
    translation IS translation
    children [ 
      Shape { 
        appearance Appearance { 
          material Material { 
            diffuseColor 0.5 0.5 0.5
          }
        } 
        geometry Sphere { 
          radius 0.01
        } 
      }
    ]
    color IS color
    name IS name 
  }
}

